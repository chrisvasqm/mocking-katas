info:
  name: Create post
  type: http
  seq: 2

http:
  method: POST
  url: '{{domain}}/posts'
  body:
    type: json
    data: |-
      {
        "username": "mosh",
        "imageUrl": "https://picsum.photos/id/237/1080/1080",
        "caption": "Mocking with Mosh"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setEnvVar("id", res.getBody().id);
        }

settings:
  encodeUrl: true
