info:
  name: Create post
  type: http
  seq: 2

http:
  method: POST
  url: '{{domain}}/posts'
  body:
    type: json
    data: |-
      {
        "username": "user_{{$randomUserName}}",
        "image_url": "{{$randomImageUrl}}",
        "caption": "caption: {{$randomLoremSentence}}"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setEnvVar("id", res.getBody().id);
        }

settings:
  encodeUrl: true
