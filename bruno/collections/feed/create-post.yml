info:
  name: Create post
  type: http
  seq: 3

http:
  method: POST
  url: "{{domain}}/posts"
  body:
    type: json
    data: |-
      {
        "username": "user_{{$randomUserName}}",
        "image_url": "{{$randomImageUrl}}",
        "caption": "caption_{{$randomLoremSentence}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setEnvVar("id", res.getBody().id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
